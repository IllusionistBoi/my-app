name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reject generated or sensitive tracked files
        shell: bash
        run: |
          set -euo pipefail
          tracked="$(
            git ls-files |
              grep -E '(^|/)(node_modules|venv|\.venv|__pycache__|build|dist|coverage|staticfiles)(/|$)|(^|/)\.env($|\.)|(^|/).*\.(sqlite3?|db|pem|key|p12|pfx)$' |
              grep -Ev '(^|/)\.env(\.[A-Za-z0-9_-]+)?\.example$' || true
          )"
          if [[ -n "$tracked" ]]; then
            echo "Generated or sensitive files are tracked:"
            echo "$tracked"
            exit 1
          fi

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        env:
          CI: "true"
        run: npm test

      - name: Build production bundle
        env:
          CI: "true"
          VITE_API_URL: /api
        run: npm run build

  backend:
    name: Backend test and deployment checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: poker_planning_test
          POSTGRES_USER: poker_planning
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poker_planning -d poker_planning_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend/poker_project
    env:
      DATABASE_URL: postgresql://poker_planning:test-only-password@127.0.0.1:5432/poker_planning_test
      DJANGO_SECRET_KEY: ci-only-secret-key-with-more-than-fifty-characters-change-me
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DB_SSL_REQUIRED: "false"
      CORS_ALLOWED_ORIGINS: https://example.test
      CSRF_TRUSTED_ORIGINS: https://example.test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/poker_project/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Reject migration drift
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python manage.py test --verbosity 2

      - name: Collect production static assets
        run: python manage.py collectstatic --noinput

      - name: Run Django deployment checks
        run: python manage.py check --deploy --fail-level WARNING

  e2e:
    name: Multi-browser end-to-end
    needs:
      - frontend
      - backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: poker_planning_e2e
          POSTGRES_USER: poker_planning
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poker_planning -d poker_planning_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      DATABASE_URL: postgresql://poker_planning:test-only-password@127.0.0.1:5432/poker_planning_e2e
      DJANGO_SECRET_KEY: ci-only-secret-key-with-more-than-fifty-characters-change-me
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_SECURE_SSL_REDIRECT: "false"
      DB_SSL_REQUIRED: "false"
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:4175
      CSRF_TRUSTED_ORIGINS: http://127.0.0.1:4175
      VITE_API_URL: http://127.0.0.1:8011/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/poker_project/requirements.txt

      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Install backend
        working-directory: backend/poker_project
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run two-participant and responsive flows
        working-directory: frontend
        run: npm run test:e2e

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/poker_project/requirements.txt

      - name: Audit backend dependencies
        working-directory: backend/poker_project
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip pip-audit
          python -m pip_audit -r requirements.txt --strict
